[project]
name = "dmcp"
version = "0.0.1"
description = "DynamicMCPBench: trace-grounded benchmark generation from live MCP servers"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "DynamicMCPBench contributors" }]

dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.7",
    "anyio>=4.4",
    "httpx>=0.27",
    "typer>=0.12",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
servers = [
    "mcp-server-time>=2025.1",
    "mcp-server-fetch>=2025.1",
    "mcp-server-git>=2025.1",
    "mcp-server-sqlite>=0.1",
    "wikipedia-mcp>=2.0",
    "arxiv-mcp-server>=0.2",
    "yfinance-mcp>=0.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
annotate = [
    "rich>=13.0",
    "huggingface-hub>=0.23",
]

[project.scripts]
dmcp = "dmcp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dmcp"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "UP042",  # str+Enum is intentional — works cleanly with Pydantic discriminators
    "SIM103", # multi-clause guard returns are clearer than a single negated return
    "SIM108", # if/else can be more readable than a wide ternary
]

[tool.ruff.lint.per-file-ignores]
"dmcp/cli.py" = ["E501"]  # typer Annotated declarations naturally exceed line limits

[tool.pytest.ini_options]
asyncio_mode = "auto"
